<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex, nofollow">
  <title>挪车信息</title>
  <link rel="icon" type="image/svg+xml" href="electric-car-charging.svg">
  <link rel="stylesheet" href="styles.css">
  <script src="plate-utils.js" defer></script>
  <script src="info.js" defer></script>
</head>
<body class="info-page">
  <main class="page">
    <section class="panel">
      <div id="carPlate" class="plate" aria-label="车牌号">
        <span class="plate-screw screw-top-left" aria-hidden="true"></span>
        <span class="plate-screw screw-top-right" aria-hidden="true"></span>
        <span class="plate-screw screw-bottom-left" aria-hidden="true"></span>
        <span class="plate-screw screw-bottom-right" aria-hidden="true"></span>
        <span id="carProvince">京</span><span id="carLetter">A</span><span class="plate-dot" aria-hidden="true">•</span><span id="carNumber">88888</span>
      </div>
      <h1>临时停靠，请多关照</h1>
      <p class="copy"><span class="copy-desktop">如车辆影响通行，请点击下方按钮联系车主挪车。</span><span class="copy-mobile">点击下方按钮联系车主</span></p>
      <a id="callButton" class="call-button" aria-disabled="true">一键呼叫</a>
      <p id="notice" class="notice">本卡片纯静态离线运行，不经服务器存储；联系方式直接编码在二维码链接中，点击按钮即可拨号。</p>
    </section>
  </main>
</body>
</html>
